services:
  # ── Laravel App (Apache, Production) ───────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: laravel-app
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "8080:80"
    networks:
      - shared-net
    env_file:
      - .env

networks:
  shared-net:
    external: true
